# Databricks Apps configuration.
# Add a SQL warehouse to the app as a resource with the key "sql-warehouse" (the default key),
# and give the app's service principal access to the model and tables (see README.md).
# For the clinician and patient database, add a Lakebase database as a second resource (it sets
# PGHOST, PGUSER and the other PG* settings by itself). Which compute to use is set in db.py.
command: ["streamlit", "run", "app.py"]
env:
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse
