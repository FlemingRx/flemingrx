# FlemingRx brand theme. Colours come from the logo: navy #132557 and teal #009788.
[theme]
base = "light"
primaryColor = "#009788"
backgroundColor = "#F5F7FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1B2541"
borderColor = "#E2E7EF"
showWidgetBorder = true
baseRadius = "10px"
buttonRadius = "10px"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Plus Jakarta Sans:https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
chartCategoricalColors = ["#009788", "#132557", "#E0A43A", "#8A94A8"]

[client]
toolbarMode = "minimal"
